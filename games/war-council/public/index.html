<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>军议 · War Council</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%9A%94%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>军议 <small>War Council</small></h1>
    <div id="hud">
      <span id="tick">回合 0</span>
      <span id="brain" class="badge">…</span>
      <button id="pause">暂停</button>
      <button id="reset">重开</button>
    </div>
  </header>
  <main>
    <section id="field">
      <canvas id="map" width="768" height="512"></canvas>
      <p class="hint">点击地图插入坐标，点击敌军插入编号。三位将领由大模型实时驱动——用自然语言下令、鼓舞或责备他们。</p>
      <div id="banner" hidden></div>
      <div id="events"></div>
    </section>
    <aside>
      <div id="generals"></div>
      <div id="chat"></div>
      <form id="order">
        <select id="to">
          <option value="all">众将</option>
          <option value="A">霍烈</option>
          <option value="B">苏璃</option>
          <option value="C">老秦</option>
        </select>
        <input id="text" autocomplete="off" placeholder="例如：霍烈从南桥绕后突袭 E2 的弓手，老秦守住中桥" />
        <button>下令</button>
      </form>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
